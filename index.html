<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Server Countdown</title>
        <style id="doc-st">
            body {
                --bg-image:url("background0.png");
                background-color: burlywood;
                color: antiquewhite;
                -webkit-text-stroke: 2px black;
                font-family: sans-serif;

                /*Center text?*/
                min-height: 100vh;
                margin: 0;

                display: flex;
                justify-content: center; 
                align-items: center;    
                
                text-align: center;
            }

            body::before {
                content: "";
                position: fixed;
                top: -10px;
                left: -10px;
                right: -10px;
                bottom: -10px;
                z-index: -1;
                
                background-image: var(--bg-image);
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
                
                filter: blur(8px);
                -webkit-filter: blur(8px);
            }

            h1 {
                margin-top: 20px;
                text-align: center;
                font-size: 70px;
            }

            p {
                text-align: center;
                font-size: 60px;
            }
        </style>
    </head>

    <body>
        <div style="vertical-align: middle;">
            <h1 c>Countdown Until The Next Session</h1>
            <b>
                <p id="Time"></p>
            </b>
        </div>
    </body>

</html>

<script src="script.js"></script>
